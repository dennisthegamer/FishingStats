plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.mod_version}+mc${project.minecraft_range}"
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-fabric"
}

repositories {
	// Modrinth Maven for ModMenu and YACL
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}

	// isXander's Maven for YACL
	maven {
		name = "isXander"
		url = "https://maven.isxander.dev/releases"
	}

	// Quilt Maven for quilt-parsers (ModMenu dev runtime)
	maven {
		name = "QuiltMC"
		url = "https://maven.quiltmc.org/repository/release"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// ModMenu for mod listing and configuration - compile/dev only on this branch,
	// users install the ModMenu build matching their Minecraft version
	modCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
	modLocalRuntime "maven.modrinth:modmenu:${project.modmenu_version}"
	// ModMenu 15.x expects quilt-parsers from a newer loader; the Modrinth maven has no
	// transitive deps, so provide them in the dev runtime explicitly (not shipped in the jar)
	localRuntime "org.quiltmc.parsers:json:0.3.1"
	localRuntime "org.quiltmc.parsers:gson:0.3.1"

	// YACL for configuration screens (isXander maven; users install separately)
	modImplementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
