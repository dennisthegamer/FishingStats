architectury { common('fabric', 'neoforge') }

dependencies {
	// compile-time only: provides the Mixin library. Never CALL loader classes from common.
	modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
	// Architectury API (events + keybind/HUD registration abstraction)
	modCompileOnly "dev.architectury:architectury:${rootProject.architectury_version}"
	// YACL for the config screen (client-only class, referenced from client entrypoints only)
	modCompileOnly "dev.isxander:yet-another-config-lib:${rootProject.yacl_version}-fabric"
}

repositories {
	mavenCentral()
}

dependencies {
	testImplementation platform('org.junit:junit-bom:5.10.2')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}
