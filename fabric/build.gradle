plugins { id 'com.gradleup.shadow' }

architectury { platformSetupLoomIde(); fabric() }

repositories { mavenLocal() }

configurations {
	common
	shadowCommon
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common
}

dependencies {
	modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
	modApi "dev.architectury:architectury-fabric:${rootProject.architectury_version}"
	modImplementation "maven.modrinth:modmenu:${rootProject.modmenu_version}"
	modImplementation "dev.isxander:yet-another-config-lib:${rootProject.yacl_version}-fabric"
	common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
	shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive = false }

	// jar-in-jar: hudlib-core is pure Java (no Minecraft refs), so it can be included directly.
	include "de.dennisthegamer:hudlib-core:1.0.8"
	// jar-in-jar: hudlib-ui references Minecraft classes, so it must go through modImplementation
	// (loom remaps it) before being embedded, so the nested jar carries intermediary references.
	include(modImplementation("de.dennisthegamer:hudlib-ui:1.0.8+mc1.21.9-1.21.11"))
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

shadowJar {
	exclude 'architectury.common.json'
	configurations = [project.configurations.shadowCommon]
	archiveClassifier = 'dev-shadow'
}

remapJar {
	input.set shadowJar.archiveFile
	dependsOn shadowJar
	archiveClassifier = null
}

jar {
	from(rootProject.file('LICENSE')) {
		rename { "${it}_${rootProject.archives_base_name}" }
	}
}
