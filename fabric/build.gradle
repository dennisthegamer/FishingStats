plugins {
	id 'net.fabricmc.fabric-loom'
	id 'maven-publish'
}

version = "${project.mod_version}+mc${project.minecraft_range}"
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-fabric"
}

repositories {
	mavenLocal()

	maven {
		name = 'DennisTheGamer'
		url = 'https://dennisthegamer.github.io/maven'
	}

	mavenCentral()

	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}

	// Modrinth Maven for ModMenu and YACL
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
}

// Shared sources: compiled into this jar (no jar-in-jar, no extra artifact)
sourceSets.main {
	java.srcDir rootProject.file('common/src/main/java')
	resources.srcDir rootProject.file('common/src/main/resources')
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// MC 26.1 is unobfuscated - no mappings needed with fabric-loom plugin
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// ModMenu for mod listing and configuration
	implementation "maven.modrinth:modmenu:${project.modmenu_version}"

	// YACL for configuration screens (Fabric classifier)
	implementation "maven.modrinth:yacl:${project.yacl_version}-fabric"

	// HudLib (mavenLocal, jar-in-jar)
	implementation "de.dennisthegamer:hudlib-core:1.1.1"
	include "de.dennisthegamer:hudlib-core:1.1.1"
	implementation "de.dennisthegamer:hudlib-ui:1.1.1+mc26.1"
	include "de.dennisthegamer:hudlib-ui:1.1.1+mc26.1"
}

loom {
	runs.named('client') {
		ideConfigGenerated true
		runDir 'run'
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = "${project.archives_base_name}-fabric"
			from components.java
		}
	}

	repositories {
	}
}
