# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache
org.gradle.configuration-cache=false

# Minecraft
# check these on https://fabricmc.net/develop
minecraft_version=26.3
# Supported MC range (jar name: <mod>-<loader>-<version>+mc<range>.jar)
minecraft_range=26.3

# Build plugins
loom_version=1.17.21
# 2.0.141 kann MC 26.3 nicht aufsetzen: der NeoForm-Recompile scheitert an
# HolderSet$1.contents(). Erst 2.0.147 (bringt JST 2.0.11) baut 26.3.
moddev_version=2.0.147

# Fabric
loader_version=0.19.5
fabric_version=0.160.5+26.3

# NeoForge
# NeoForge 26.3.0.1-beta existiert seit 2026-09-15 (POM bindet neoform 26.3-1).
neoforge_version=26.3.0.1-beta

# Mod Properties
mod_id=fishingstats
mod_version=1.2.2
maven_group=de.dennisthegamer.fishingstats
archives_base_name=fishingstats

# ModMenu (Fabric only)
modmenu_version=21.0.0-beta.1

# YACL (per-loader classifier is appended in the subproject build files)
yacl_version=3.9.7+26.3

# HudLib
hudlib_version=1.2.1
hudlib_mc_range=26.3
