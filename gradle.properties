# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache
org.gradle.configuration-cache=false

# Minecraft
# check these on https://fabricmc.net/develop
minecraft_version=26.2
# Supported MC range (jar name: <mod>-<loader>-<version>+mc<range>.jar)
minecraft_range=26.2

# Build plugins
loom_version=1.17.13
moddev_version=2.0.141

# Fabric
loader_version=0.19.3
fabric_version=0.152.1+26.2

# NeoForge
neoforge_version=26.2.0.10-beta

# Mod Properties
mod_id=fishingstats
mod_version=1.2.1
maven_group=de.dennisthegamer.fishingstats
archives_base_name=fishingstats

# ModMenu (Fabric only)
modmenu_version=20.0.0-beta.3

# YACL (per-loader classifier is appended in the subproject build files)
yacl_version=3.9.5+26.2
