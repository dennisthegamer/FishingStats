# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache
org.gradle.configuration-cache=false

# Minecraft
# Compatible with Minecraft 1.21.9 through 1.21.11
minecraft_version=1.21.11
# Supported MC range (jar name: <mod>-<loader>-<version>+mc<range>.jar)
minecraft_range=1.21.9-1.21.11

# Build plugins (Architectury template; dev.architectury.loom-remap for 1.21.9+)
arch_plugin_version=3.5.168
arch_loom_version=1.14.476
shadow_version=9.5.1

# Fabric
loader_version=0.18.3
fabric_version=0.140.0+1.21.11

# NeoForge
neoforge_version=21.11.42

# Mod Properties
mod_version=1.1.1
maven_group=de.dennisthegamer.fishingstats
archives_base_name=fishingstats

# Dependencies
# Architectury pinned to the oldest release covering this MC range so we only compile
# against API present in all of 1.21.9-1.21.11.
architectury_version=18.0.3
modmenu_version=17.0.0
yacl_version=3.8.2+1.21.11
