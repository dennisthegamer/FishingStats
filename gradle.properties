# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache
org.gradle.configuration-cache=false

# Minecraft
# Built against 1.21.8 (drawText void); ABI-correct for >=1.21.6.
# The 1.21-1.21.5 half is served by the mc1.21.5 branch.
minecraft_version=1.21.8
minecraft_range=1.21.6-1.21.8

# Build plugins (Architectury template; dev.architectury.loom for <=1.21.8)
arch_plugin_version=3.4.164
arch_loom_version=1.11.454
shadow_version=9.5.1

# Fabric
loader_version=0.18.3
fabric_version=0.136.1+1.21.8

# NeoForge
neoforge_version=21.8.53

# Mod Properties
mod_version=1.1.0
maven_group=de.dennisthegamer.fishingstats
archives_base_name=fishingstats

# Dependencies
architectury_version=17.0.8
modmenu_version=15.0.0
# YACL pinned to 3.7.1+1.21.6: arch-loom 1.11.454 rejects newer YACL (classTweaker widener)
yacl_version=3.7.1+1.21.6
