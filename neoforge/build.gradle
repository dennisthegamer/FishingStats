plugins { id 'com.gradleup.shadow' }

architectury { platformSetupLoomIde(); neoForge() }

repositories { mavenLocal() }

configurations {
	common
	shadowCommon
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentNeoForge.extendsFrom common
}

dependencies {
	neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
	modApi "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"
	modCompileOnly "dev.isxander:yet-another-config-lib:${rootProject.yacl_version}-neoforge"
	common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
	shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }
	// jar-in-jar: hudlib-core is pure Java (no Minecraft refs), so it can be included directly.
	include "de.dennisthegamer:hudlib-core:1.0.5"
	// jar-in-jar: hudlib-ui must be the mojmap variant here. The default artifact is remapped to
	// intermediary for Fabric, and nothing in the NeoForge include pipeline converts it back, so
	// bundling it made the config screen die on NoClassDefFoundError: net/minecraft/class_437.
	// Plain include + compileOnly on purpose: modImplementation would send it through Loom's
	// remap pipeline, which is exactly what must not happen to an already-mojmap jar.
	compileOnly "de.dennisthegamer:hudlib-ui-neoforge:1.0.5+mc1.21-1.21.5"
	include "de.dennisthegamer:hudlib-ui-neoforge:1.0.5+mc1.21-1.21.5"
}

processResources {
	inputs.property 'version', project.version

	filesMatching('META-INF/neoforge.mods.toml') {
		expand 'version': project.version
	}
}

shadowJar {
	exclude 'architectury.common.json'
	configurations = [project.configurations.shadowCommon]
	archiveClassifier = 'dev-shadow'
}

remapJar {
	input.set shadowJar.archiveFile
	dependsOn shadowJar
	archiveClassifier = null
}

jar {
	from(rootProject.file('LICENSE')) {
		rename { "${it}_${rootProject.archives_base_name}" }
	}
}
