plugins {
	id 'net.neoforged.moddev'
	id 'maven-publish'
}

version = "${project.mod_version}+mc${project.minecraft_range}"
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-neoforge"
}

repositories {
	mavenLocal()

	mavenCentral()

	maven {
		name = 'NeoForged'
		url = 'https://maven.neoforged.net/releases/'
	}

	// Modrinth Maven for YACL
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
}

// Shared sources: compiled into this jar (no jar-in-jar, no extra artifact)
sourceSets.main {
	java.srcDir rootProject.file('common/src/main/java')
	resources.srcDir rootProject.file('common/src/main/resources')
}

neoForge {
	version = project.neoforge_version

	runs {
		client {
			client()
			gameDirectory = file('run')
		}
	}

	mods {
		register(project.mod_id) {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// YACL for configuration screens (NeoForge classifier)
	implementation "maven.modrinth:yacl:${project.yacl_version}-neoforge"

	// HudLib (mavenLocal, jar-in-jar via NeoForge JarJar)
	implementation "de.dennisthegamer:hudlib-core:1.1.1"
	jarJar "de.dennisthegamer:hudlib-core:1.1.1"
	implementation "de.dennisthegamer:hudlib-ui-neoforge:1.1.1+mc${project.minecraft_range}"
	jarJar "de.dennisthegamer:hudlib-ui-neoforge:1.1.1+mc${project.minecraft_range}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = "${project.archives_base_name}-neoforge"
			from components.java
		}
	}

	repositories {
	}
}
