modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"

issueTrackerURL = "https://github.com/DennisTheGamer/FishingStats/issues"
[[mods]]
modId = "fishingstats"
version = "${version}"
displayName = "FishingStats"
displayURL = "https://modrinth.com/mod/fishingstats"
description = '''Tracks fishing sessions: casts, catches by category, time-to-bite, treasure rates and rare finds - with session history, statistics and a live HUD.'''
authors = "Dennis_thegamer"
logoFile = "assets/fishingstats/icon.png"

[[mixins]]
config = "fishingstats.mixins.json"

[[dependencies.fishingstats]]
modId = "neoforge"
type = "required"
versionRange = "[21.0,21.6)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.fishingstats]]
modId = "minecraft"
type = "required"
versionRange = "[1.21,1.21.6)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.fishingstats]]
modId = "architectury"
type = "required"
versionRange = "[13.0.0,)"
ordering = "AFTER"
side = "CLIENT"

# YACL is only needed to open the config screen (same as "suggests" on Fabric)
[[dependencies.fishingstats]]
modId = "yet_another_config_lib_v3"
type = "optional"
versionRange = "[3.7,)"
ordering = "NONE"
side = "CLIENT"
